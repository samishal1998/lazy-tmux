# bedouin manifest: `bedouin install samishal1998/lazy-tmux`
name: ltm
description: Modern subcommands, interactive prompts and a TUI for tmux
homepage: https://github.com/samishal1998/lazy-tmux
bin: ltm
assets:
  x86_64-unknown-linux-musl: ltm-x86_64-unknown-linux-musl.tar.gz
  aarch64-unknown-linux-musl: ltm-aarch64-unknown-linux-musl.tar.gz
  x86_64-apple-darwin: ltm-x86_64-apple-darwin.tar.gz
  aarch64-apple-darwin: ltm-aarch64-apple-darwin.tar.gz
checksums: SHA256SUMS
completions:
  bash: "{bin} completions bash"
  zsh: "{bin} completions zsh"
  fish: "{bin} completions fish"
